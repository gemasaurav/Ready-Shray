```html <!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Shray - Call Interface</title> <script src="https://cdn.tailwindcss.com"></script> <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet"> <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"> <style> body { font-family: 'Sora', sans-serif; background-color: #101415; color: white; } .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); } .neon-glow { box-shadow: 0 0 25px rgba(0, 219, 231, 0.3); } .neon-text { text-shadow: 0 0 10px rgba(0, 219, 231, 0.5); } .call-visualizer { background: radial-gradient(circle at center, rgba(0, 219, 231, 0.1) 0%, transparent 70%); } ::-webkit-scrollbar { width: 0; background: transparent; } </style> </head> <body class="min-h-screen flex flex-col items-center justify-between py-12 px-6"> <!-- Top Status --> <header class="w-full flex justify-between items-center px-2"> <a href="contacts.html" class="p-3 hover:bg-white/5 rounded-full transition-colors"> <i class="material-icons text-white/40">arrow_back</i> </a> <div class="flex flex-col items-center"> <div class="flex items-center gap-2 mb-1"> <div class="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse"></div> <span class="text-[10px] font-black tracking-[0.2em] uppercase text-white/40">Encrypted Uplink</span> </div> <span class="text-xs font-bold text-[#00dbe7] tracking-widest">04:12</span> </div> <button class="p-3 hover:bg-white/5 rounded-full transition-colors"> <i class="material-icons text-white/40">more_vert</i> </button> </header> <!-- Caller Identity --> <main class="flex flex-col items-center text-center"> <div class="relative mb-10"> <!-- Animated Background Rings --> <div class="absolute inset-0 -m-8 border border-[#00dbe7]/10 rounded-full animate-[ping_3s_linear_infinite]"></div> <div class="absolute inset-0 -m-16 border border-[#00dbe7]/5 rounded-full animate-[ping_4s_linear_infinite]"></div> <!-- Profile Image Container --> <div class="w-48 h-48 rounded-[3rem] glass p-2 relative z-10 neon-glow overflow-hidden"> <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&q=80&w=400" alt="Aryan K." class="w-full h-full object-cover rounded-[2.5rem]"> <div class="absolute inset-0 call-visualizer"></div> </div> <!-- Voice Indicator --> <div class="absolute -bottom-4 right-4 w-12 h-12 bg-[#00dbe7] rounded-2xl flex items-center justify-center text-[#101415] neon-glow z-20"> <i class="material-icons">graphic_eq</i> </div> </div> <h2 class="text-4xl font-bold tracking-tight mb-2">Aryan Khurana</h2> <p class="text-white/40 tracking-widest font-bold text-[10px] uppercase">Mobile • Mumbai, IN</p> </main> <!-- Call Controls --> <div class="w-full max-w-sm"> <!-- Control Grid --> <div class="grid grid-cols-3 gap-6 mb-12"> <div class="flex flex-col items-center gap-3"> <button class="w-16 h-16 rounded-full glass flex items-center justify-center text-white/60 hover:text-white transition-colors"> <i class="material-icons">mic_off</i> </button> <span class="text-[9px] font-bold text-white/40 tracking-widest uppercase">Mute</span> </div> <div class="flex flex-col items-center gap-3"> <button class="w-16 h-16 rounded-full glass flex items-center justify-center text-white/60 hover:text-white transition-colors"> <i class="material-icons">dialpad</i> </button> <span class="text-[9px] font-bold text-white/40 tracking-widest uppercase">Keypad</span> </div> <div class="flex flex-col items-center gap-3"> <button class="w-16 h-16 rounded-full glass flex items-center justify-center text-[#00dbe7] bg-[#00dbe7]/10"> <i class="material-icons">volume_up</i> </button> <span class="text-[9px] font-bold text-[#00dbe7] tracking-widest uppercase">Speaker</span> </div> <div class="flex flex-col items-center gap-3"> <button class="w-16 h-16 rounded-full glass flex items-center justify-center text-white/60 hover:text-white transition-colors"> <i class="material-icons">add_call</i> </button> <span class="text-[9px] font-bold text-white/40 tracking-widest uppercase">Add</span> </div> <div class="flex flex-col items-center gap-3"> <button class="w-16 h-16 rounded-full glass flex items-center justify-center text-white/60 hover:text-white transition-colors"> <i class="material-icons">videocam</i> </button> <span class="text-[9px] font-bold text-white/40 tracking-widest uppercase">Video</span> </div> <div class="flex flex-col items-center gap-3"> <button class="w-16 h-16 rounded-full glass flex items-center justify-center text-white/60 hover:text-white transition-colors"> <i class="material-icons">contact_page</i> </button> <span class="text-[9px] font-bold text-white/40 tracking-widest uppercase">Contacts</span> </div> </div> <!-- End Call Button --> <div class="flex flex-col items-center"> <button class="w-20 h-20 rounded-full bg-red-500 text-white flex items-center justify-center shadow-[0_0_30px_rgba(239,68,68,0.4)] active:scale-95 transition-transform"> <i class="material-icons text-4xl">call_end</i> </button> <span class="mt-4 text-[10px] font-black tracking-[0.2em] uppercase text-red-500/60">Terminate Link</span> </div> </div> </body> </html> ```
