```html <!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Shray - Listening State</title> <script src="https://cdn.tailwindcss.com"></script> <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet"> <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" /> <style> body { font-family: 'Sora', sans-serif; background-color: #0b0f10; color: white; overflow: hidden; } .glow-circle { box-shadow: 0 0 60px rgba(0, 219, 231, 0.3), inset 0 0 40px rgba(0, 219, 231, 0.2); } .listening-pulse { animation: pulse 2s infinite ease-in-out; } @keyframes pulse { 0% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.05); opacity: 1; box-shadow: 0 0 80px rgba(0, 219, 231, 0.5); } 100% { transform: scale(1); opacity: 0.8; } } .bars-container { display: flex; align-items: center; gap: 4px; height: 40px; } .bar { width: 4px; background: #00dbe7; border-radius: 2px; animation: wave 1.2s infinite ease-in-out; } @keyframes wave { 0%, 100% { height: 10px; } 50% { height: 35px; } } </style> </head> <body class="flex flex-col h-screen"> <!-- Header --> <header class="flex justify-between items-center px-6 py-6 z-10"> <div class="flex items-center gap-2"> <span class="material-symbols-outlined text-secondary">settings_heart</span> <h1 class="text-xl font-bold tracking-tighter">SHRAY</h1> </div> <div class="flex items-center gap-4"> <div class="bg-white/5 border border-white/10 rounded-full px-4 py-1 flex items-center gap-2"> <div class="w-2 h-2 bg-cyan-400 rounded-full animate-pulse"></div> <span class="text-xs font-semibold tracking-widest uppercase">Online</span> </div> <span class="material-symbols-outlined text-white/50">sensors</span> </div> </header> <!-- Main Content --> <main class="flex-1 flex flex-col items-center justify-center relative px-6 -mt-12"> <div class="t
